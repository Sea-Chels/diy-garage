<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>DIY Garage</title>
    <meta name="description" content="Click a part of the car, see what you can fix yourself, and watch how-to videos for your exact make, model and year." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand"><span class="brand-mark"><i data-icon="wrench" data-size="20"></i></span> DIY Garage</div>
        <div class="vehicle-picker" id="vehicle-picker"></div>
        <div class="topbar-actions">
          <button id="glossary-btn" class="ghost-btn"><i data-icon="book" data-size="16"></i>Glossary</button>
        </div>
      </header>
      <main>
        <div class="stage">
          <canvas id="scene" aria-label="Interactive car. Click a part to see what you can fix."></canvas>
          <div class="hint" id="hint">Drag to look around. Click a glowing dot.</div>
          <nav class="quick-fixes" id="quick-fixes" aria-label="Quick fixes"></nav>
        </div>
        <aside class="panel" id="panel" aria-live="polite"></aside>
      </main>
      <div id="modal-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
